# -----------------------------------------------------------------------------
# Custom Controller Algorithm Parameters
# 这里只放自研 controller/Controller 内部算法参数。
# Nav2 原生控制器（例如 DWB）的参数仍放在 nav2_params.yaml。
# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    FollowPath:
      controller_name: "DWA" # 算法名称，可选 PID / LQR / RPP / DWA

      heading_aligner:
        enable_start_alignment: false # 起步时是否先原地对齐预瞄点方向
        enable_goal_alignment: true # 终点角度对齐交给 Nav2 goal_checker / BT 处理
        control_frequency: 20.0 # 对齐模块控制频率 [Hz]
        start_alignment_max_distance: 2.0 # 机器人距离起步预瞄点超过该值后不再触发起步对齐 [m]
        start_lookahead_dist: 0.8 # 起步对齐使用的预瞄点距离 [m]
        start_yaw_threshold: 0.5 # 起步航向误差超过该值才进入对齐 [rad]
        start_yaw_tolerance: 0.08 # 起步对齐完成阈值 [rad]
        goal_position_tolerance: 0.2 # 进入终点原地旋转的位置距离阈值 [m]
        goal_yaw_tolerance: 0.25 # 终点朝向对齐完成阈值 [rad]
        angular_kp: 1.5 # 对齐角速度比例增益
        angular_kd: 0.05 # 航向误差微分增益，抑制对齐阶段转向振荡
        max_angular_velocity: 1.0 # 对齐最大角速度 [rad/s]
        min_angular_velocity: 0.0 # 对齐最小角速度 [rad/s]
        max_angular_velocity_increment: 0.2 # 单周期最大角速度增量 [rad/s]

      goal_speed_limiter:
        enabled: true # 接近终点时是否根据剩余距离限制线速度
        max_linear_velocity: 0.8 # 用于计算开始减速距离的最大线速度 [m/s]
        max_decel: 0.2 # 用于计算距离限速曲线的最大减速度 [m/s^2]
        brake_distance_scale: 1.5 # 理论减速距离安全系数，越大越早减速
        brake_distance_buffer: 0.2 # 理论刹车距离外的固定安全余量 [m]

      curvature_speed_limiter:
        enabled: true # 是否根据局部路径曲率限制前向速度
        max_lateral_accel: 0.6 # 横向加速度上限 [m/s^2]，越小越保守
        min_linear_velocity: 0.0 # 曲率限速结果低于该值时输出 0 [m/s]
        curvature_epsilon: 0.001 # 曲率接近 0 时的保护项，避免除零
        sample_distance: 0.25 # 曲率采样点沿路径的间隔 [m]
        preview_distance: 1.5 # 从机器人前方多远范围内搜索最大曲率 [m]

      PID:
        control_frequency: 20.0 # 控制器内部计算频率 [Hz]
        goal_dist_tolerance: 0.2 # 到达目标的位置距离容差 [m]
        rotate_tolerance: 0.25 # 到达目标后的朝向容差 [rad]

        max_linear_velocity: 1.2 # 最大线速度 [m/s]
        min_linear_velocity: 0.0 # 最小线速度 [m/s]，用于限制低速输出
        max_linear_velocity_increment: 0.015 # 单周期最大线速度增量 [m/s]，限制加速突变
        max_angular_velocity: 1.2 # 最大角速度 [rad/s]
        min_angular_velocity: 0.0 # 最小角速度 [rad/s]，用于限制低速输出
        max_angular_velocity_increment: 0.2 # 单周期最大角速度增量 [rad/s]，限制转向突变

        lookahead_time: 1.0 # 前视时间 [s]，通常速度越快前视距离越长
        min_lookahead_dist: 0.5 # 最小前视距离 [m]
        max_lookahead_dist: 1.5 # 最大前视距离 [m]

        p_linear_velocity: 1.0 # 线速度比例增益，越大响应越快但更容易振荡
        i_linear_velocity: 0.0 # 线速度积分增益，用于消除稳态误差
        d_linear_velocity: 0.0 # 线速度微分增益，用于抑制快速变化
        p_angular_velocity: 3.0 # 角速度比例增益，越大转向越积极
        i_angular_velocity: 0.3 # 角速度积分增益，用于消除角度稳态误差
        d_angular_velocity: 0.3 # 角速度微分增益，用于抑制转向振荡

        k_feedback: 2.0 # 保留参数，当前双通道 PID 不再使用
        dist_from_center_to_front_edge: 0.20 # 保留参数，当前双通道 PID 不再使用
        model_based_mode: false # 保留参数，当前 PID 固定使用纵向速度 + 横向航向双通道控制

        heading_slowdown_start: 0.5 # 航向误差超过该值开始降低期望线速度 [rad]
        heading_slowdown_end: 1.2 # 航向误差达到该值时降到最小速度比例 [rad]
        heading_stop_threshold: 1.8 # 航向误差超过该值时线速度目标置 0，仅转向 [rad]
        min_heading_slowdown_speed_ratio: 0.25 # 航向误差较大但未停车时的最小线速度比例

      LQR:
        control_frequency: 20.0 # 控制器内部计算频率 [Hz]
        goal_dist_tolerance: 0.2 # 到达目标的位置距离容差 [m]
        rotate_tolerance: 0.25 # 保留参数，与原项目对齐

        max_linear_velocity: 1.2 # 最大线速度 [m/s]
        min_linear_velocity: 0.0 # 最小线速度 [m/s]
        max_linear_velocity_increment: 0.015 # 单周期最大线速度增量 [m/s]
        max_angular_velocity: 1.2 # 最大角速度 [rad/s]
        min_angular_velocity: 0.0 # 最小角速度 [rad/s]
        max_angular_velocity_increment: 0.2 # 单周期最大角速度增量 [rad/s]

        lookahead_time: 0.8 # 前视时间 [s]
        min_lookahead_dist: 0.3 # 最小前视距离 [m]
        max_lookahead_dist: 1.2 # 最大前视距离 [m]

        solver_max_iterations: 100 # Riccati 迭代最大次数
        solver_eps: 0.1 # Riccati 迭代收敛阈值

        q_matrix_x: 1.0 # 状态误差权重 Q_x
        q_matrix_y: 1.0 # 状态误差权重 Q_y
        q_matrix_theta: 1.5 # 状态误差权重 Q_theta
        r_matrix_v: 1.0 # 控制输入权重 R_v
        r_matrix_w: 1.0 # 控制输入权重 R_w

      RPP:
        control_frequency: 20.0 # 控制器内部计算频率 [Hz]
        goal_dist_tolerance: 0.2 # 到达目标的位置距离容差 [m]
        rotate_tolerance: 0.25 # 到达目标后的朝向容差 [rad]

        max_linear_velocity: 1.0 # 最大线速度 [m/s]
        min_linear_velocity: 0.0 # 最小线速度 [m/s]
        max_linear_velocity_increment: 0.01 # 单周期最大线速度增量 [m/s]
        max_angular_velocity: 1.2 # 最大角速度 [rad/s]
        min_angular_velocity: 0.0 # 最小角速度 [rad/s]
        max_angular_velocity_increment: 0.2 # 单周期最大角速度增量 [rad/s]

        lookahead_time: 1.0 # 前视时间 [s]
        min_lookahead_dist: 0.3 # 最小前视距离 [m]
        max_lookahead_dist: 0.9 # 最大前视距离 [m]

        regulated_min_radius: 0.9 # 小转弯半径时开始触发曲率限速 [m]
        inflation_cost_factor: 3.0 # 由 costmap cost 反推障碍距离的启发式因子
        scaling_dist: 0.6 # 障碍接近到该距离内开始缩放速度 [m]
        scaling_gain: 1.0 # 障碍约束缩放增益
        approach_dist: 0.8 # 距终点小于该距离时开始减速 [m]
        approach_min_v: 0.1 # 接近终点时保底线速度 [m/s]

      DWA:
        control_frequency: 20.0 # 控制器内部计算频率 [Hz]
        max_linear_velocity: 1.0 # 最大线速度 [m/s]
        min_linear_velocity: 0.0 # 最小线速度 [m/s]
        max_linear_velocity_increment: 0.02 # 单周期最大线速度增量 [m/s]
        max_angular_velocity: 1.2 # 最大角速度 [rad/s]
        min_angular_velocity: 0.0 # 最小角速度 [rad/s]
        max_angular_velocity_increment: 0.8 # 单周期最大角速度增量 [rad/s]

        sim_time: 1.5 # 每个候选速度前向模拟时长 [s]
        sim_time_step: 0.1 # 前向模拟积分步长 [s]
        vx_samples: 5 # 线速度采样数量
        vtheta_samples: 15 # 角速度采样数量

        path_distance_bias: 2.0 # 轨迹终点贴近全局路径的权重
        goal_distance_bias: 1.0 # 轨迹终点靠近目标的权重
        obstacle_distance_bias: 0.02 # 轨迹经过高代价区域的权重
        alignment_bias: 1.5 # 前鼻子贴近路径方向的权重
        goal_front_bias: 1.0 # 前鼻子朝局部目标推进的权重
        velocity_bias: 4.0 # 鼓励更大的前向速度，避免低速轨迹长期占优
        twirling_bias: 0.8 # 惩罚过大的角速度，减少原地转圈
        oscillation_bias: 5.0 # 惩罚短时间内角速度方向反复切换
        unknown_as_obstacle: false # 是否把未知区域视为障碍

        forward_point_distance: 0.325 # 前鼻子评分点相对机器人中心的距离 [m]
        alignment_goal_distance_scale: 1.0 # 接近目标时关闭 alignment 的距离系数
        robot_radius: 0.18 # 未配置 footprint 时使用的圆形半径 [m]
        footprint_scaling_speed: 0.25 # 速度超过该值后开始放大 footprint [m/s]
        max_footprint_scaling_factor: 0.2 # footprint 最大放大比例
        stop_time_buffer: 0.2 # 轨迹需预留的刹停安全时间 [s]
        oscillation_reset_dist: 0.05 # 移动超过该距离后重置振荡状态 [m]
        oscillation_reset_angle: 0.2 # 转过该角度后重置振荡状态 [rad]
        oscillation_min_angular_velocity: 0.2 # 小于该角速度不记录振荡方向 [rad/s]
